<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="업데이트: 2026/08/20" />
    <title>핱페스 포스타입 통계</title>
    <link rel="stylesheet" href="styles.css?v=20260919-6" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand-logo" href="#top" aria-label="홈으로 이동">
          <img src="logo.webp" alt="로고" class="header-logo-img" />
        </a>
        <p id="updated-at" class="updated-at"></p>
      </div>
      <nav class="page-nav" aria-label="페이지 메뉴">
        <button type="button" class="page-tab" data-page="trend" aria-selected="false">개인</button>
        <button type="button" class="page-tab active" data-page="main" aria-selected="true">home</button>
        <button type="button" class="page-tab" data-page="detail" aria-selected="false">CP</button>
      </nav>
    </header>

    <main id="top" class="page-shell">
      <div class="page-view active" data-page-view="main">
        <section class="hero" aria-labelledby="page-title">
          <h1 id="page-title">핱페스 포타 개수 순위</h1>
        </section>

        <section class="controls" aria-label="순위 목록 필터">
          <label class="search-field">
            <span class="sr-only">항목 검색</span>
            <input id="search" type="search" placeholder="항목 검색" autocomplete="off" />
          </label>
          <label class="month-field">
            <span class="sr-only">순위 기준 연월</span>
            <input id="ranking-month" type="month" disabled />
          </label>
        </section>

        <section class="ranking-section" aria-label="CP 순위">
          <div class="section-heading ranking-heading">
            <div class="ranking-filter-group" id="ranking-filter-group" role="group" aria-label="순위 목록 보기 필터">
              <button type="button" class="filter-chip active" data-count="10">TOP 10</button>
              <button type="button" class="filter-chip" data-count="20">TOP 20</button>
              <button type="button" class="filter-chip" data-count="all">전체</button>
            </div>
            <span id="result-count" class="result-count"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>순위</th><th>CP</th><th>개수</th><th>순위 변동</th></tr>
              </thead>
              <tbody id="ranking-body"></tbody>
            </table>
          </div>
          <p id="empty-state" class="empty-state" hidden>검색 결과가 없습니다.</p>
        </section>

        <section class="overview-chart" aria-label="누적 포타 개수 추이">
          <div class="section-heading">
            <div><h2>누적 포타 개수 추이</h2></div>
            <div class="chart-filter-group" id="chart-filter-group" role="group" aria-label="추이 그래프 보기 필터">
              <button type="button" class="filter-chip" data-count="5">TOP 5</button>
              <button type="button" class="filter-chip active" data-count="10">TOP 10</button>
              <button type="button" class="filter-chip" data-count="20">TOP 20</button>
            </div>
          </div>
          <div id="overview-graph" class="overview-graph" aria-live="polite"></div>
          <div id="chart-legend" class="chart-legend" aria-label="항목 범례"></div>
        </section>
      </div>

      <div class="page-view" data-page-view="trend" hidden>
        <section class="view-heading" aria-labelledby="personal-page-title">
          <h1 id="personal-page-title">개인 통계</h1>
        </section>
        <section class="member-section personal-section" aria-labelledby="member-title">
          <div class="section-heading">
            <div><h2 id="member-title">왼른 비율 및 포타 개수</h2></div>
          </div>
          <div id="member-stats-body" class="personal-stats-grid"></div>
        </section>
      </div>

      <div class="page-view" data-page-view="detail" hidden>
        <section class="view-heading" aria-labelledby="detail-page-title">
          <h1 id="detail-page-title">CP 통계</h1>
        </section>
        <section class="detail-panel" aria-labelledby="member-picker-title">
          <h2 id="member-picker-title">멤버 2명을 선택해 주세요</h2>
          <div id="member-picker-grid" class="member-picker-grid"></div>

          <div id="pair-detail" class="pair-detail" hidden>
            <div id="pair-ratio" class="pair-ratio" aria-label="선택한 두 멤버의 CP 비율"></div>
            <div class="detail-table-controls">
              <div id="detail-cp-buttons" class="detail-cp-buttons" role="group" aria-label="CP 선택"></div>
              <button id="detail-sort-button" type="button">최신순</button>
            </div>
            <div class="table-wrap detail-table-wrap">
              <table>
                <thead><tr><th>달</th><th>누적 개수</th><th>순위</th></tr></thead>
                <tbody id="detail-table-body">
                  <tr><td colspan="3" class="detail-empty">CP를 선택하면 데이터가 표시됩니다.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </main>
    <footer>© <span id="year"></span> RankView</footer>
    <script src="app.js?v=20260919-7"></script>
  </body>
</html>
