<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="항목별 순위와 변화 추이를 확인하는 대시보드" />
    <title>순위 대시보드</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="순위 대시보드 홈">Rank<span>View</span></a>
      <p id="updated-at" class="updated-at"></p>
    </header>

    <main id="top" class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">RANKING DASHBOARD</p>
        <h1 id="page-title">한눈에 보는 항목별 순위</h1>
        <p id="page-description">순위 변화와 수치를 빠르게 확인하세요.</p>
      </section>

      <section class="summary-grid" aria-label="요약">
        <article><span>집계 항목</span><strong id="total-items">–</strong></article>
        <article><span>1위 항목</span><strong id="top-item">–</strong></article>
        <article><span>가장 큰 상승</span><strong id="biggest-rise">–</strong></article>
      </section>

      <section class="controls" aria-label="순위 목록 필터">
        <label class="search-field">
          <span class="sr-only">항목 검색</span>
          <input id="search" type="search" placeholder="항목 검색" autocomplete="off" />
        </label>
        <button id="sort-button" type="button" aria-pressed="false">변동 큰 순</button>
      </section>

      <section class="ranking-section" aria-labelledby="ranking-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">CURRENT RANKING</p>
            <h2 id="ranking-title">현재 순위</h2>
          </div>
          <span id="result-count" class="result-count"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>순위</th><th>항목</th><th>개수</th><th>순위 변동</th><th>기간 추이</th></tr>
            </thead>
            <tbody id="ranking-body"></tbody>
          </table>
        </div>
        <p id="empty-state" class="empty-state" hidden>검색 결과가 없습니다.</p>
      </section>
    </main>
    <footer>© <span id="year"></span> RankView</footer>
    <script src="app.js"></script>
  </body>
</html>
